name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v3

    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-node: '3.9'
    - name: Run Unit Tests
      run: python test_app.py

    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.Ajay23v }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        
        TAG=$(git rev-parse --short HEAD)
        docker build -t ${{ secrets.Ajay23v }}/calculator:$TAG .
        docker push ${{ secrets.Ajay23v }}/calculator:$TAG
